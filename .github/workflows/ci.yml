name: TruthLens Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Secret & Hygiene Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          if [ -f .env ]; then
            echo "ERROR: Plaintext .env file detected in repository root!"
            exit 1
          fi
          # Ensure .env.example exists and has no live secrets
          if [ ! -f .env.example ]; then
            echo "ERROR: .env.example template is missing!"
            exit 1
          fi
          echo "Secret hygiene verified: .env excluded, .env.example present."

  backend-tests:
    name: Backend & ML Test Suite
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Training & Calibration Pipeline
        run: |
          python -m ml.training.train

      - name: Verify Alembic Schema Migrations
        run: |
          python -m alembic upgrade head

      - name: Run Pytest Suite (API & ML)
        run: |
          python -m pytest apps/api/tests ml/tests --verbose

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Production Bundle
        working-directory: apps/web
        run: npm run build
